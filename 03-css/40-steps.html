<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>00-template</title>
    <link rel="stylesheet" href="../src/css/Styles.css">
    <style>
        :root {
            --size: 256px;
        }
        section {
            div.bg {
                background: url(imgs/bg-steps.png);
                            no-repeat center / cover;
                border-radius: 12px;
                outline: 4px solid #fff;
                corner-shape: squircle;
                position: relative;
                height: 600px;
                
                div.trainer {
                    background: url(imgs/steps-all.png);
                                no-repeat;
                                background-position-x: 0;
                    transform: scale(.6);
                    position: absolute;
                    bottom: 0;
                    left: 4rem;
                    height: var(--size);
                    width: var(--size);
                    
                    animation: 0.8s animTrainer steps(4) infinite;

                    &.front { background-position-y: calc(var (--size) * 0);  }
                    &.left  { background-position-y: calc(var (--size) * -1); }
                    &.right { background-position-y: calc(var (--size) * -2); }
                    &.back  { background-position-y: calc(var (--size) * -3); }
                }
            }
        }
        @keyframes animTrainer {
            100% {background-position-x: -1024px ;}
        }


    </style>
</head>
<body class="css">
    <nav class="back">
        <a href="../index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M232,200a8,8,0,0,1-16,0,88.1,88.1,0,0,0-88-88H51.31l34.35,34.34a8,8,0,0,1-11.32,11.32l-48-48a8,8,0,0,1,0-11.32l48-48A8,8,0,0,1,85.66,61.66L51.31,96H128A104.11,104.11,0,0,1,232,200Z"></path></svg>
        </a>
    </nav>
    <main>
            <header class="mainmenu submenu">
            <h1>40-steps </h1>
            <img src="../src/img/logo-css.png" alt="Css">
            <h3>Función de tiempo (steps()) utilizada en animaciones CSS para dividir una transición en fotogramas discretos, común en animaciones estilo sprite fotograma a fotograma.</h3>
            </header>
            <section>
                <h2 class="subtitle">Example :</h2>
                <div class="bg">
                    <div class="trainer front"></div>
            </section>
    </main>
</body>
</html>
