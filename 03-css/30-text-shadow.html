<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30-text-shadow</title>
    <link rel="stylesheet" href="../src/css/Styles.css">
    <style>
        section {
            p {
                text-align: center;
                font-size: 3.6rem;

                &.txt1 {
                    text-shadow: 0px 0px 12px lime;
                }
                &.txt2 {
                    text-shadow: -8px -8px 8px;
                }
                &.txt3 {
                    font-weight: 900;
                    text-shadow:     0 1px 0 hsl(174,5%,80%),
	                0 2px 0 hsl(174,5%,75%),
	                0 3px 0 hsl(174,5%,70%),
	                0 4px 0 hsl(174,5%,66%),
	                0 5px 0 hsl(174,5%,64%),
	                0 6px 0 hsl(174,5%,62%),
	                0 7px 0 hsl(174,5%,61%),
	                0 8px 0 hsl(174,5%,60%),
	
	                0 0 5px rgba(0,0,0,.05),
	                0 1px 3px rgba(0,0,0,.2),
	                0 3px 5px rgba(0,0,0,.2),
	                0 5px 10px rgba(0,0,0,.2),
	                0 10px 10px rgba(0,0,0,.2),
	                0 20px 20px rgba(0,0,0,.3);
                }
                &.txt4 {
                    color: #fff;
                    letter-spacing: 0.6rem;
                    text-shadow: -5px 0 0 #fcdd09,
                                -10px 0 0 #078930;

                }
            }
        }
    </style>
</head>
<body class="css">
    <nav class="back">
        <a href="../index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M232,200a8,8,0,0,1-16,0,88.1,88.1,0,0,0-88-88H51.31l34.35,34.34a8,8,0,0,1-11.32,11.32l-48-48a8,8,0,0,1,0-11.32l48-48A8,8,0,0,1,85.66,61.66L51.31,96H128A104.11,104.11,0,0,1,232,200Z"></path></svg>
        </a>
    </nav>
    <main>
            <header class="mainmenu submenu">
            <h1>30-text-shadow </h1>
            <img src="../src/img/logo-css.png" alt="Css">
            <h3>Propiedad que añade efectos de sombra directamente al texto, aceptando valores de desplazamiento, radio de desenfoque y color.</h3>
            </header>
            <section>
            <h2 class="subtitle">Examples:</h2>
            <p class="txt txt1">ADSO</p>
            <p class="txt txt2">C.P.I.C</p>
            <p class="txt txt3">SENA</p>
            <p class="txt txt4">Caldas</p>
        </section>
    </main>
</body>
</html>
