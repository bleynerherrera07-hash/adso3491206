<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>31-filters</title>
    <link rel="stylesheet" href="../src/css/Styles.css">
    <style>
        section {
            img.filter {
                display: block;
                width: 160px;
                margin: 1rem auto;
                transition: ALL 0.4s ease-in;
                

                &.filter1 {
                    filter: grayscale(1);
                }

                &.filter2 {
                    filter: blur(6px);
                }

                &.filter3 {
                    filter: sepia(1);
                }

                &.filter4 {
                    filter: brightness(.2);
                }

                &.filter5 {
                    filter: invert(1);
                }

                &.filter6 {
                    filter: drop-shadow(2px 2px 12px aqua);
                }

                &.filter7 {
                    filter: hue-rotate(120deg);
                }
                
                &:hover {
                    filter:none;
                }
            }
        }
    </style>
</head>
<body class="css">
    <nav class="back">
        <a href="../index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M232,200a8,8,0,0,1-16,0,88.1,88.1,0,0,0-88-88H51.31l34.35,34.34a8,8,0,0,1-11.32,11.32l-48-48a8,8,0,0,1,0-11.32l48-48A8,8,0,0,1,85.66,61.66L51.31,96H128A104.11,104.11,0,0,1,232,200Z"></path></svg>
        </a>
    </nav>
    <main>
            <header class="mainmenu submenu">
            <h1>31-filters </h1>
            <img src="../src/img/logo-css.png" alt="Css">
            <h3>Propiedad (filter) que aplica efectos visuales o gráficos (ej. blur(), grayscale(), contrast(), drop-shadow()) a un elemento antes de renderizarlo.</h3>
            </header>
            <section>
            <h2 class="subtitle">GrayScale</h2>
            <img class="filter filter1" src="imgs/inosuke.png" alt="Inosuke">
            <h2 class="subtitle">Blur</h2>
            <img class="filter filter2" src="imgs/inosuke.png" alt="Inosuke">
            <h2 class="subtitle">Sepia</h2>
            <img class="filter filter3" src="imgs/inosuke.png" alt="Inosuke">
            <h2 class="subtitle">Brightness</h2>
            <img class="filter filter4" src="imgs/inosuke.png" alt="Inosuke">
            <h2 class="subtitle">Invert</h2>
            <img class="filter filter5" src="imgs/inosuke.png" alt="Inosuke">
            <h2 class="subtitle">drop shadow</h2>
            <img class="filter filter6" src="imgs/inosuke.png" alt="Inosuke">
            <h2 class="subtitle">hue rotate</h2>
            <img class="filter filter7" src="imgs/inosuke.png" alt="Inosuke">
        </section>
    </main>
</body>
</html>
